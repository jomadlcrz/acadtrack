services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acadtrack-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: acadtrack
      DB_USERNAME: acadtrack
      DB_PASSWORD: secret
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USERNAME: gwc.acadtrack@gmail.com
      MAIL_PASSWORD: bjopqgwahqakrvga
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: gwc.acadtrack@gmail.com
      MAIL_FROM_NAME: "GWC Acadtrack"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: acadtrack-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: acadtrack
      MYSQL_USER: acadtrack
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - acadtrack_db_data:/var/lib/mysql
      - ./database/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "acadtrack", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: acadtrack-pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  acadtrack_db_data:
